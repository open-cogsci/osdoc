<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">
		<link rel="icon" href="{{ SITEURL }}/theme/img/osdoc.png" />
		<title>{% block page_title %}{% endblock %}</title>
		<link href="{{ SITEURL }}/theme/css/mega-menu.css" rel="stylesheet">
		<link href="{{ SITEURL }}/theme/css/bootstrap.min.css" rel="stylesheet">
		<link href="{{ SITEURL }}/theme/css/monokai.css" rel="stylesheet">
		<!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
		<!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
		<!--[if lt IE 9]>
		<script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
		<script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
		<![endif]-->
		<script type="module" src="https://sigmundai.eu/public/search-widget.js"></script>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.9.0/css/all.min.css" integrity="sha512-q3eWabyZPc1XTCmF+8/LuE1ozpg5xxn7iO89yfSOd5/oKvyqLngoNGsx8jq92Y8eXJ/IRxQbEC+FGSYxtk2oiw==" crossorigin="anonymous" referrerpolicy="no-referrer" />		
		<link href='https://fonts.googleapis.com/css?family=Roboto|Roboto+Condensed|Ubuntu+Mono|Roboto+Slab' rel='stylesheet' type='text/css'>
		{% include "google-analytics.html" %}
		{% include "cookie-consent.html" %}
		{% include "translation.html" %}
	</head>
	<body onpageshow="if (typeof onPageShow !== 'undefined') onPageShow()" onload="suggestTranslation();">
		{% include 'cogsci-products.html' %}
		<!-- Main container than contains everything -->
		<div class="container osdoc-container osdoc">
			<!-- Top banner -->
			<div class="row visible-lg visible-md">
				<div class="col-md-12 osdoc-banner"></div>
			</div>
			<!--  Top menu, only visible for small screens -->
			<div class="row">
				<div class="navbar navbar-default cogsci-navbar" role="navigation">
					<div class="container">
							<div class="navbar-header">
								<button class="navbar-toggle" type="button" data-toggle="collapse" data-target=".js-navbar-collapse">
									<span class="sr-only">Toggle navigation</span>
									<span class="icon-bar"></span>
									<span class="icon-bar"></span>
									<span class="icon-bar"></span>
								</button>
								<a class="navbar-brand" href="{{ SITEURL }}/"><img src='{{ SITEURL }}/theme/img/osdoc.png' /></a>
							</div>
				
							<div class="collapse navbar-collapse js-navbar-collapse">
								<ul class="nav navbar-nav">
									{% block mega_menu %}
									{% endblock %}
								</ul>
							</div>
					</div>
				</div>
			</div>
			<!-- Main row containing both the sidebar and the content-->
			<div class="row">
				<!-- Sidebar, only visible on large screens -->
				<div class="col-md-4 cogsci-sidebar visible-lg visible-md">
					{% include 'supported-by.html' %}
				</div>
				<!-- Content -->
				<div class="col-md-8 cogsci-content">
					<search-widget endpoint="https://sigmundai.eu/public/search"></search-widget>
					{% block content %}
					{% endblock %}
				</div>
			</div>
			<!-- Footer -->
			<div class="row">
				<div class="col-md-12 cogsci-footer">
					{% include 'footer.html' %}
				</div>
			</div>
		</div>
		<!-- Bootstrap/ jquery JavaScript -->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
		<script src="{{ SITEURL }}/theme/js/bootstrap.min.js"></script>
		<script src="{{ SITEURL }}/theme/js/osdoc.js"></script>
	</body>
</html>
